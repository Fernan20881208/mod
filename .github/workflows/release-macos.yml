name: Publish macOS Release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-macos.yml'
      - 'mod.json'
      - 'src/**'
      - 'CMakeLists.txt'
      - 'resources/**'
      - 'logo.png'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Click Indicators for macOS
        id: geode_build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: MacOS
          sdk: given
          build-config: Release
          use-lto: true

      - name: Verify macOS package
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ steps.geode_build.outputs.build-output }}"
          GEODE="$(find "$OUT" -maxdepth 1 -name '*.geode' -print -quit)"
          VERSION="$(jq -r '.version' mod.json)"

          test -n "$GEODE"
          test -f "$GEODE"
          unzip -t "$GEODE"

          rm -rf verify-macos
          mkdir verify-macos
          unzip -q "$GEODE" -d verify-macos

          DYLIB="verify-macos/bogdoner.click-indicators.dylib"
          test -f "$DYLIB"
          test -f verify-macos/mod.json
          test ! -e verify-macos/bogdoner.click-indicators.ios.dylib
          test ! -e verify-macos/bogdoner.click-indicators.android32.so
          test ! -e verify-macos/bogdoner.click-indicators.android64.so
          test ! -e verify-macos/bogdoner.click-indicators.dll

          file "$DYLIB" | tee macos-binary.txt
          grep -Eq 'Mach-O 64-bit.*(arm64|x86_64)' macos-binary.txt

          jq -e --arg version "$VERSION" '
            .id == "bogdoner.click-indicators" and
            .version == $version and
            .geode == "5.10.1" and
            .gd.mac == "2.2081"
          ' verify-macos/mod.json >/dev/null

          cp "$GEODE" bogdoner.click-indicators.geode
          shasum -a 256 bogdoner.click-indicators.geode | tee macos-sha256.txt

          echo "=== VERIFIED MACOS PACKAGE ==="
          jq '{id, version, geode, gd}' verify-macos/mod.json
          ls -lh bogdoner.click-indicators.geode "$DYLIB"
          cat macos-binary.txt
          cat macos-sha256.txt

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(jq -r '.version' mod.json)"
          ARCH="$(file verify-macos/bogdoner.click-indicators.dylib | grep -oE 'arm64|x86_64' | head -n1)"
          cat > RELEASE_NOTES.md <<EOF
          Click Indicators ${VERSION} for Geometry Dash 2.2081 on macOS.

          - Geode SDK 5.10.1
          - Release build with LTO
          - Native macOS Mach-O binary (${ARCH})
          - Includes the current feature set from main

          Install this .geode file through Geode on macOS and restart Geometry Dash if requested.
          EOF

      - name: Publish or replace macOS release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(jq -r '.version' mod.json)"
          if gh release view MacOS --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload MacOS bogdoner.click-indicators.geode \
              --repo "${{ github.repository }}" --clobber
            gh release edit MacOS \
              --repo "${{ github.repository }}" \
              --title "macOS ${VERSION} - Geode 5.10.1" \
              --notes-file RELEASE_NOTES.md
          else
            gh release create MacOS bogdoner.click-indicators.geode \
              --repo "${{ github.repository }}" \
              --title "macOS ${VERSION} - Geode 5.10.1" \
              --notes-file RELEASE_NOTES.md \
              --target main --latest=false
          fi

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(jq -r '.version' mod.json)"
          gh release view MacOS --repo "${{ github.repository }}" --json tagName,name,assets \
            | tee published-macos.json

          jq -e --arg name "macOS ${VERSION} - Geode 5.10.1" '
            .tagName == "MacOS" and
            .name == $name and
            ([.assets[] | select(.name == "bogdoner.click-indicators.geode")] | length) == 1
          ' published-macos.json >/dev/null

          LOCAL_SIZE="$(stat -f%z bogdoner.click-indicators.geode)"
          REMOTE_SIZE="$(jq -r '.assets[] | select(.name == "bogdoner.click-indicators.geode") | .size' published-macos.json)"
          test "$LOCAL_SIZE" = "$REMOTE_SIZE"
          echo "Published macOS ${VERSION} asset verified: $REMOTE_SIZE bytes"
