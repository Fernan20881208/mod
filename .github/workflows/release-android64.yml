name: Publish Android64 Release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-android64.yml'
      - 'mod.json'
      - 'src/**'
      - 'CMakeLists.txt'
      - 'resources/**'
      - 'logo.png'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-android64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Click Indicators for Android64
        id: geode_build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: given
          build-config: Release
          use-lto: true

      - name: Verify Android64 package
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ steps.geode_build.outputs.build-output }}"
          GEODE="$(find "$OUT" -maxdepth 1 -name '*.geode' -print -quit)"
          VERSION="$(jq -r '.version' mod.json)"

          test -n "$GEODE"
          test -f "$GEODE"
          unzip -t "$GEODE"

          rm -rf verify-android64
          mkdir verify-android64
          unzip -q "$GEODE" -d verify-android64

          SO="verify-android64/bogdoner.click-indicators.android64.so"
          test -f "$SO"
          test -f verify-android64/mod.json
          test ! -e verify-android64/bogdoner.click-indicators.android32.so

          file "$SO" | tee android64-binary.txt
          grep -Eq 'ELF 64-bit.*ARM aarch64' android64-binary.txt
          readelf -h "$SO" | tee android64-elf-header.txt
          grep -Eq 'Class:[[:space:]]+ELF64' android64-elf-header.txt
          grep -Eq 'Machine:[[:space:]]+AArch64' android64-elf-header.txt

          jq -e --arg version "$VERSION" '
            .id == "bogdoner.click-indicators" and
            .version == $version and
            .geode == "5.10.1" and
            .gd.android == "2.2081"
          ' verify-android64/mod.json >/dev/null

          cp "$GEODE" bogdoner.click-indicators.geode
          sha256sum bogdoner.click-indicators.geode | tee android64-sha256.txt

          echo "=== VERIFIED ANDROID64 PACKAGE ==="
          jq '{id, version, geode, gd}' verify-android64/mod.json
          ls -lh bogdoner.click-indicators.geode "$SO"
          cat android64-binary.txt
          cat android64-sha256.txt

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(jq -r '.version' mod.json)"
          cat > RELEASE_NOTES.md <<EOF
          Click Indicators ${VERSION} for Geometry Dash 2.2081 on 64-bit Android.

          - Geode SDK 5.10.1
          - Android64 / arm64-v8a
          - Release build with LTO
          - Package integrity and metadata validated
          - Native Android64 binary verified as ELF64 AArch64
          - Includes the current feature set from main

          If an older copy is installed, remove/update it and install this file through Geode.
          EOF

      - name: Replace Android64 release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(jq -r '.version' mod.json)"
          gh release view Android --repo "${{ github.repository }}" >/dev/null
          gh release upload Android bogdoner.click-indicators.geode \
            --repo "${{ github.repository }}" --clobber
          gh release edit Android \
            --repo "${{ github.repository }}" \
            --title "Android-64 ${VERSION}" \
            --notes-file RELEASE_NOTES.md

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(jq -r '.version' mod.json)"
          gh release view Android --repo "${{ github.repository }}" --json tagName,name,assets \
            | tee published-android64.json

          jq -e --arg name "Android-64 ${VERSION}" '
            .tagName == "Android" and
            .name == $name and
            ([.assets[] | select(.name == "bogdoner.click-indicators.geode")] | length) == 1
          ' published-android64.json >/dev/null

          LOCAL_SIZE="$(stat -c%s bogdoner.click-indicators.geode)"
          REMOTE_SIZE="$(jq -r '.assets[] | select(.name == "bogdoner.click-indicators.geode") | .size' published-android64.json)"
          test "$LOCAL_SIZE" = "$REMOTE_SIZE"
          echo "Published Android64 ${VERSION} asset verified: $REMOTE_SIZE bytes"
