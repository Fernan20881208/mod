name: Publish iOS Release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-ios.yml'
      - 'mod.json'
      - 'src/**'
      - 'CMakeLists.txt'
      - 'resources/**'
      - 'logo.png'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Click Indicators for iOS
        id: geode_build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: iOS
          sdk: given
          build-config: Release
          use-lto: true

      - name: Verify iOS package
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ steps.geode_build.outputs.build-output }}"
          GEODE="$(find "$OUT" -maxdepth 1 -name '*.geode' -print -quit)"
          VERSION="$(jq -r '.version' mod.json)"

          test -n "$GEODE"
          test -f "$GEODE"
          unzip -t "$GEODE"

          rm -rf verify-ios
          mkdir verify-ios
          unzip -q "$GEODE" -d verify-ios

          DYLIB="verify-ios/bogdoner.click-indicators.ios.dylib"
          test -f "$DYLIB"
          test -f verify-ios/mod.json
          test ! -e verify-ios/bogdoner.click-indicators.android32.so
          test ! -e verify-ios/bogdoner.click-indicators.android64.so
          test ! -e verify-ios/bogdoner.click-indicators.dll

          file "$DYLIB" | tee ios-binary.txt
          grep -Eq 'Mach-O 64-bit arm64' ios-binary.txt

          jq -e --arg version "$VERSION" '
            .id == "bogdoner.click-indicators" and
            .version == $version and
            .geode == "5.10.1" and
            .gd.ios == "2.2081"
          ' verify-ios/mod.json >/dev/null

          cp "$GEODE" bogdoner.click-indicators.geode
          shasum -a 256 bogdoner.click-indicators.geode | tee ios-sha256.txt

          echo "=== VERIFIED IOS PACKAGE ==="
          jq '{id, version, geode, gd}' verify-ios/mod.json
          ls -lh bogdoner.click-indicators.geode "$DYLIB"
          cat ios-binary.txt
          cat ios-sha256.txt

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(jq -r '.version' mod.json)"
          cat > RELEASE_NOTES.md <<EOF
          Click Indicators ${VERSION} for Geometry Dash 2.2081 on iOS.

          - Geode SDK 5.10.1
          - Native iOS arm64 binary
          - iOS 14+
          - Compatible with the Geode iOS / Helper JIT-less flow
          - Includes iPhone landscape safe-area handling
          - Includes the current feature set from main

          Import bogdoner.click-indicators.geode in the Geode iOS Launcher, enable it, then regenerate/update the Helper before launching the game.
          EOF

      - name: Publish or replace iOS release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(jq -r '.version' mod.json)"
          if gh release view iOS --repo "${{ github.repository }}" >/dev/null 2>&1; then
            # The original iOS release used an uppercase asset name. GitHub asset
            # names are case-sensitive, so remove it explicitly before uploading
            # the canonical lowercase v7.5.0 package.
            gh release delete-asset iOS Bogdoner.click-indicators.geode \
              --repo "${{ github.repository }}" -y 2>/dev/null || true
            gh release upload iOS bogdoner.click-indicators.geode \
              --repo "${{ github.repository }}" --clobber
            gh release edit iOS \
              --repo "${{ github.repository }}" \
              --title "iOS ${VERSION} - Geode 5.10.1" \
              --notes-file RELEASE_NOTES.md
          else
            gh release create iOS bogdoner.click-indicators.geode \
              --repo "${{ github.repository }}" \
              --title "iOS ${VERSION} - Geode 5.10.1" \
              --notes-file RELEASE_NOTES.md \
              --target main --latest=false
          fi

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(jq -r '.version' mod.json)"
          gh release view iOS --repo "${{ github.repository }}" --json tagName,name,assets \
            | tee published-ios.json

          jq -e --arg name "iOS ${VERSION} - Geode 5.10.1" '
            .tagName == "iOS" and
            .name == $name and
            ([.assets[] | select(.name == "bogdoner.click-indicators.geode")] | length) == 1 and
            ([.assets[] | select(.name == "Bogdoner.click-indicators.geode")] | length) == 0
          ' published-ios.json >/dev/null

          LOCAL_SIZE="$(stat -f%z bogdoner.click-indicators.geode)"
          REMOTE_SIZE="$(jq -r '.assets[] | select(.name == "bogdoner.click-indicators.geode") | .size' published-ios.json)"
          test "$LOCAL_SIZE" = "$REMOTE_SIZE"
          echo "Published iOS ${VERSION} asset verified: $REMOTE_SIZE bytes"
