name: Publish Windows64 Release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows64:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Click Indicators for Windows64
        id: geode_build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Win64
          sdk: given
          build-config: Release
          use-lto: true

      - name: Verify Windows64 package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = '${{ steps.geode_build.outputs.build-output }}'
          $geode = Get-ChildItem -Path $out -Filter '*.geode' -File | Select-Object -First 1
          if (-not $geode) { throw 'No .geode package was produced.' }

          Copy-Item $geode.FullName 'verify-windows64.zip' -Force
          if (Test-Path 'verify-windows64') { Remove-Item 'verify-windows64' -Recurse -Force }
          Expand-Archive -Path 'verify-windows64.zip' -DestinationPath 'verify-windows64' -Force

          $dll = Join-Path 'verify-windows64' 'bogdoner.click-indicators.dll'
          if (-not (Test-Path $dll)) { throw 'Missing bogdoner.click-indicators.dll' }
          if (Test-Path 'verify-windows64/bogdoner.click-indicators.android32.so') { throw 'Android32 binary was accidentally bundled.' }
          if (Test-Path 'verify-windows64/bogdoner.click-indicators.android64.so') { throw 'Android64 binary was accidentally bundled.' }
          if (Test-Path 'verify-windows64/bogdoner.click-indicators.ios.dylib') { throw 'iOS binary was accidentally bundled.' }

          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $dll))
          if ($bytes.Length -lt 256) { throw 'Windows DLL is unexpectedly small/corrupt.' }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          if ($peOffset -lt 0 -or ($peOffset + 26) -ge $bytes.Length) { throw 'Invalid PE header offset.' }
          if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45 -or $bytes[$peOffset + 2] -ne 0 -or $bytes[$peOffset + 3] -ne 0) { throw 'Invalid PE signature.' }
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          $magic = [BitConverter]::ToUInt16($bytes, $peOffset + 24)
          if ($machine -ne 0x8664) { throw ('Wrong PE machine: 0x{0:X4}; expected AMD64 0x8664.' -f $machine) }
          if ($magic -ne 0x20B) { throw ('Wrong PE optional-header magic: 0x{0:X}; expected PE32+ 0x20B.' -f $magic) }

          $meta = Get-Content 'verify-windows64/mod.json' -Raw | ConvertFrom-Json
          if ($meta.id -ne 'bogdoner.click-indicators') { throw 'Wrong mod ID.' }
          if ($meta.geode -ne '5.10.1') { throw 'Wrong Geode version.' }
          if ($meta.gd.win -ne '2.2081') { throw 'Wrong Geometry Dash Windows version.' }

          Copy-Item $geode.FullName 'bogdoner.click-indicators.geode' -Force
          $hash = (Get-FileHash 'bogdoner.click-indicators.geode' -Algorithm SHA256).Hash.ToLower()
          $packageSize = (Get-Item 'bogdoner.click-indicators.geode').Length
          $dllSize = (Get-Item $dll).Length
          "SHA256=$hash"
          "Package size=$packageSize bytes"
          "DLL size=$dllSize bytes"
          "PE machine=AMD64 (0x8664), PE32+"

      - name: Prepare release notes
        shell: pwsh
        run: |
          @'
          Click Indicators v7.4.0 for Geometry Dash 2.2081 on 64-bit Windows.

          - Geode SDK 5.10.1
          - Windows 64-bit / x86-64
          - Release build with LTO
          - Package extracted and metadata validated
          - Native `bogdoner.click-indicators.dll` verified as PE32+ AMD64
          - Workflow rejects Android/iOS binaries accidentally bundled into the Windows package

          Install `bogdoner.click-indicators.geode` through Geode on a supported 64-bit Windows installation.
          '@ | Set-Content -Path 'RELEASE_NOTES.md' -Encoding UTF8

      - name: Publish or replace Windows64 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view Windows --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload Windows 'bogdoner.click-indicators.geode' --repo '${{ github.repository }}' --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Failed to replace Windows release asset.' }
            gh release edit Windows --repo '${{ github.repository }}' --title 'Windows-64' --notes-file 'RELEASE_NOTES.md'
            if ($LASTEXITCODE -ne 0) { throw 'Failed to update Windows release metadata.' }
          }
          else {
            gh release create Windows 'bogdoner.click-indicators.geode' --repo '${{ github.repository }}' --title 'Windows-64' --notes-file 'RELEASE_NOTES.md' --target main --latest=false
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create Windows release.' }
          }

      - name: Verify published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $json = gh release view Windows --repo '${{ github.repository }}' --json tagName,name,assets | ConvertFrom-Json
          if ($json.tagName -ne 'Windows') { throw 'Published release has wrong tag.' }
          if ($json.name -ne 'Windows-64') { throw 'Published release has wrong name.' }
          $assets = @($json.assets | Where-Object { $_.name -eq 'bogdoner.click-indicators.geode' })
          if ($assets.Count -ne 1) { throw "Expected exactly one Windows .geode asset; found $($assets.Count)." }
          $localSize = (Get-Item 'bogdoner.click-indicators.geode').Length
          if ([int64]$assets[0].size -ne [int64]$localSize) { throw 'Published asset size does not match verified local package.' }
          "Published Windows64 asset verified: $localSize bytes"
